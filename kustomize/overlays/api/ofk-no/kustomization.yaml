apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ofk-no
resources:
  - ../../../base
labels:
  - pairs:
      app.kubernetes.io/name: fint-kontroll-device-factory
      app.kubernetes.io/instance: fint-kontroll-device-factory_ofk_no
      app.kubernetes.io/version: latest
      app.kubernetes.io/component: backend
      app.kubernetes.io/part-of: fint-kontroll
      fintlabs.no/team: bas
      fintlabs.no/org-id: ofk.no
patches:
  - patch: |-
      - op: replace
        path: "/spec/orgId"
        value: "ofk.no"
      - op: add
        path: "/spec/resources"
        value:
          limits:
            memory: "5000Mi"
          requests:
            cpu: "500m"
            memory: "1500Mi"
      - op: replace
        path: "/spec/env/1/value"
        value: "ofk-no-fint-kontroll-device-factory"
      - op: replace
        path: "/spec/orgId"
        value: "ofk.no"
      - op: replace
        path: "/spec/env/6/value"
        value: "9, 16, 101"
      - op: replace
        path: "/spec/env/7/value"
        value: "10, 11, 13, 15, 18, 102"
      - op: replace
        path: "/spec/env/8/value"
        value: "12, 14, 17, 100, 103"
      - op: replace
        path: "/spec/kafka/acls/0/topic"
        value: "ofk-no.kontroll.*"
      - op: replace
        path: "/spec/kafka/acls/1/topic"
        value: "ofk-no.kontroll.*"
      - op: add
        path: "/spec/env/-"
        value:
          name: "novari.kafka.topic.orgId"
          value: "ofk-no"
    target:
      kind: Application
      name: fint-kontroll-device-factory

